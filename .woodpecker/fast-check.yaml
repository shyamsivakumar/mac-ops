labels:
  platform: linux/arm64

clone:
  - name: git
    image: woodpeckerci/plugin-git:2.9.2@sha256:ebde4a4d07e0e24b630082484d192890dd4f6d442d90bf5466f0763860f83652
    settings:
      partial: false
      depth: 0
  - name: main
    image: woodpeckerci/plugin-git:2.9.2@sha256:ebde4a4d07e0e24b630082484d192890dd4f6d442d90bf5466f0763860f83652
    settings:
      partial: false
      depth: 0
      ref: refs/heads/main
steps:
  - name: fast-check
    image: python:3.13.12-slim-bookworm@sha256:a58daefb915e1e03ad48f3ca4df8832065412c5c35cacb9d39f4229184de12b6
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends git python3 openjdk-17-jre-headless curl ca-certificates
      - curl -fsSL https://open-vsx.org/api/tlaplus/vscode-ide/2026.10.301552/file/tlaplus.vscode-ide-2026.10.301552.vsix -o /tmp/tlaplus.vsix
      - echo "89adb8d05d3136f74a4a33c97ae35b04730cdb3fb551b81d4299ba5b56c3c5a8  /tmp/tlaplus.vsix" | sha256sum -c -
      - python3 -c "import zipfile; open('/tmp/tla2tools.jar', 'wb').write(zipfile.ZipFile('/tmp/tlaplus.vsix').read('extension/tools/tla2tools.jar'))"
      - echo "011267fca25d0752cf18894dd585cd28b96960c112ea8a20b823ea770e7e10cd  /tmp/tla2tools.jar" | sha256sum -c -
      - export MAC_OPS_TLA_JAR=/tmp/tla2tools.jar
      - git update-ref refs/remotes/origin/main HEAD
      - git reset --hard "$CI_COMMIT_SHA"
      - python3 scripts/mac_ops_fast_check.py
    when:
      - event: [push, pull_request]
