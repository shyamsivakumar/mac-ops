---
name: woodpecker-ci

services:
  server:
    build:
      context: ./woodpecker-runtime
      target: server
    image: local/woodpecker-server:3
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9000:9000"
    environment:
      WOODPECKER_HOST: "${WOODPECKER_HOST:?set WOODPECKER_HOST in .env}"
      WOODPECKER_EXPERT_WEBHOOK_HOST:
        "${WOODPECKER_WEBHOOK_HOST:?set WOODPECKER_WEBHOOK_HOST in .env}"
      WOODPECKER_SERVER_ADDR: ":8000"
      WOODPECKER_GRPC_ADDR: ":9000"
      WOODPECKER_OPEN: "false"
      WOODPECKER_ADMIN: "${WOODPECKER_ADMIN:?set WOODPECKER_ADMIN in .env}"
      WOODPECKER_REPO_OWNERS:
        "${WOODPECKER_REPO_OWNERS:?set WOODPECKER_REPO_OWNERS in .env}"
      WOODPECKER_GITHUB: "true"
      WOODPECKER_GITHUB_CLIENT_FILE: "/run/secrets/github-client"
      WOODPECKER_GITHUB_SECRET_FILE: "/run/secrets/github-secret"
      WOODPECKER_AGENT_SECRET_FILE: "/run/secrets/agent-secret"
      WOODPECKER_DISABLE_USER_AGENT_REGISTRATION: "true"
      WOODPECKER_FORCE_IGNORE_SERVICE_FAILURE: "false"
      WOODPECKER_MAX_PIPELINE_TIMEOUT: "60"
      WOODPECKER_LOG_LEVEL: "info"
    volumes:
      - server-data:/var/lib/woodpecker
      - server-secret-data:/run/secrets:ro

  webhook-proxy:
    build:
      context: ./webhook-proxy
    image: local/woodpecker-webhook-proxy:1
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "127.0.0.1:8001:8080"

  # Linux checks lane. Unlabeled linux/arm64 workflows land here.
  # Capacity 3 with Colima 10 GiB after MO-117 dedicated-CI cleanup.
  agent-linux:
    build:
      context: ./woodpecker-runtime
      target: agent
    image: local/woodpecker-agent:3
    restart: unless-stopped
    depends_on:
      - server
    environment:
      WOODPECKER_SERVER: "server:9000"
      WOODPECKER_AGENT_SECRET_FILE: "/run/secrets/agent-secret"
      WOODPECKER_HOSTNAME: "ci-linux"
      WOODPECKER_MAX_WORKFLOWS: "3"
      WOODPECKER_BACKEND: "docker"
      WOODPECKER_LOG_LEVEL: "info"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-secret-data:/run/secrets:ro
      - agent-linux-config:/etc/woodpecker

  # Deploy lane. Exclusive via !role=deploy (workflow must set role: deploy).
  # Coordinate with SRW-349 labeling .woodpecker/deploy.yaml.
  agent-deploy:
    build:
      context: ./woodpecker-runtime
      target: agent
    image: local/woodpecker-agent:3
    restart: unless-stopped
    depends_on:
      - server
    environment:
      WOODPECKER_SERVER: "server:9000"
      WOODPECKER_AGENT_SECRET_FILE: "/run/secrets/agent-secret"
      WOODPECKER_HOSTNAME: "ci-deploy"
      WOODPECKER_MAX_WORKFLOWS: "1"
      # !role needs the workflow label. role=deploy matches (3.16 needs both).
      WOODPECKER_AGENT_LABELS: "!role=deploy,role=deploy"
      WOODPECKER_BACKEND: "docker"
      WOODPECKER_LOG_LEVEL: "info"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-secret-data:/run/secrets:ro
      - agent-deploy-config:/etc/woodpecker

volumes:
  server-data:
    name: woodpecker-ci-server-data
  server-secret-data:
    name: woodpecker-ci-server-secret-data
    external: true
  agent-secret-data:
    name: woodpecker-ci-agent-secret-data
    external: true
  agent-linux-config:
    name: woodpecker-ci-agent-linux-config
  agent-deploy-config:
    name: woodpecker-ci-agent-deploy-config
